<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Contact</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 32px 16px;
    color: #1f1f1f;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 28px;
  }
  h1 { text-align: center; font-size: 22px; margin-top: 0; }
  label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #ddd; font-size: 14px;
  }
  .row { display: flex; gap: 12px; margin-top: 24px; }
  button {
    flex: 1; padding: 10px; border-radius: 8px; border: none;
    font-weight: 500; cursor: pointer; font-size: 14px;
  }
  button.primary { background: #2563eb; color: #fff; }
  button.secondary { background: #fff; color: #333; border: 1px solid #ddd; }
  .error-msg { color: #dc2626; font-size: 13px; margin-top: 12px; white-space: pre-line; }
  .success-msg { color: #16a34a; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Add New Contact</h1>
    <form id="contactForm">
      <label for="name">Name *</label>
      <input type="text" id="name" required>

      <label for="email">Email *</label>
      <input type="email" id="email" required>

      <label for="phone_number">Phone number *</label>
      <input type="text" id="phone_number" placeholder="Digits only, 7-15" required>

      <label for="address">Address</label>
      <input type="text" id="address">

      <label for="company">Company</label>
      <input type="text" id="company">

      <div class="row">
        <button type="button" class="secondary" onclick="window.location.href='home.html'">Cancel</button>
        <button type="submit" class="primary">Save Contact</button>
      </div>
      <div id="msg"></div>
    </form>
  </div>

  <script>
    const API_BASE = "http://localhost:3000";
    const form = document.getElementById("contactForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "";
      msg.textContent = "";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone_number: document.getElementById("phone_number").value,
        address: document.getElementById("address").value,
        company: document.getElementById("company").value
      };

      try {
        const res = await fetch(`${API_BASE}/contacts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const body = await res.json();

        if (!res.ok) {
          const details = body.details ? body.details.join("\n") : body.error;
          throw new Error(details || `Server responded with status ${res.status}`);
        }

        msg.className = "success-msg";
        msg.textContent = "Contact saved! Redirecting...";
        setTimeout(() => window.location.href = "home.html", 700);
      } catch (err) {
        msg.className = "error-msg";
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
