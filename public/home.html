<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Management</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 32px 16px 80px;
    color: #1f1f1f;
  }
  h1 { text-align: center; margin-bottom: 4px; }
  p.subtitle { text-align: center; color: #6b6b6b; margin-top: 0; }

  .toolbar {
    max-width: 960px;
    margin: 24px auto 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  .toolbar .left, .toolbar .right { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button {
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
  }
  button {
    cursor: pointer;
    border: none;
    background: #2563eb;
    color: #fff;
    font-weight: 500;
  }
  button.secondary { background: #fff; color: #333; border: 1px solid #ddd; }
  button.danger { background: #dc2626; }
  button:hover { opacity: 0.9; }

  .contact-table-wrapper {
    max-width: 960px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    overflow: hidden;
  }
  .contact-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .contact-table thead tr { background: #fafafa; }
  .contact-table th {
    text-align: left; padding: 12px 16px; font-weight: 500;
    color: #6b6b6b; font-size: 12px;
  }
  .contact-table td { padding: 12px 16px; border-top: 1px solid #eee; font-size: 14px; word-break: break-word; }
  .contact-table td.email { color: #6b6b6b; }
  .actions { display: flex; gap: 6px; }
  .actions button { padding: 6px 10px; font-size: 12px; }

  .pagination {
    max-width: 960px; margin: 16px auto; display: flex; justify-content: center;
    align-items: center; gap: 12px; color: #444; font-size: 14px;
  }
  .empty, .error-msg {
    max-width: 960px; margin: 24px auto; text-align: center; color: #888;
  }
  .error-msg { color: #dc2626; }
</style>
</head>
<body>
  <h1>Contact Management API</h1>
  <p class="subtitle">Search, sort, and manage your contacts</p>

  <div class="toolbar">
    <div class="left">
      <input type="text" id="searchInput" placeholder="Search by name, email or phone" />
      <select id="sortBy">
        <option value="name">Sort: Name</option>
        <option value="email">Sort: Email</option>
      </select>
      <select id="order">
        <option value="ASC">Ascending</option>
        <option value="DESC">Descending</option>
      </select>
    </div>
    <div class="right">
      <button class="secondary" id="refreshBtn">Refresh</button>
      <button id="addBtn">+ Add Contact</button>
    </div>
  </div>

  <div class="contact-table-wrapper">
    <table class="contact-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>E-mail</th>
          <th>Phone number</th>
          <th>Company</th>
          <th style="width:150px;">Actions</th>
        </tr>
      </thead>
      <tbody id="contactRows"></tbody>
    </table>
  </div>

  <div class="empty" id="emptyMsg" style="display:none;">No contacts found.</div>
  <div class="error-msg" id="errorMsg" style="display:none;"></div>

  <div class="pagination" id="pagination"></div>

  <script>
    const API_BASE = "http://localhost:3000";
    let state = { page: 1, limit: 10, sortBy: "name", order: "ASC", search: "" };
    let searchDebounce;

    async function loadContacts() {
      const params = new URLSearchParams({
        sortBy: state.sortBy,
        order: state.order,
        page: state.page,
        limit: state.limit,
        search: state.search
      });

      const errorMsg = document.getElementById("errorMsg");
      const emptyMsg = document.getElementById("emptyMsg");
      const tbody = document.getElementById("contactRows");
      errorMsg.style.display = "none";
      emptyMsg.style.display = "none";
      tbody.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE}/contacts?${params.toString()}`);
        if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
        const result = await res.json();
        const contacts = result.data;

        if (!contacts || contacts.length === 0) {
          emptyMsg.style.display = "block";
        } else {
          contacts.forEach(contact => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${escapeHtml(contact.name)}</td>
              <td class="email">${escapeHtml(contact.email)}</td>
              <td>${escapeHtml(contact.phone_number)}</td>
              <td>${escapeHtml(contact.company || "-")}</td>
              <td class="actions">
                <button class="secondary" onclick="editContact(${contact.id})">Edit</button>
                <button class="danger" onclick="deleteContact(${contact.id})">Delete</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        renderPagination(result.pagination);
      } catch (err) {
        console.error(err);
        errorMsg.textContent = "Could not load contacts: " + err.message;
        errorMsg.style.display = "block";
      }
    }

    function renderPagination(pagination) {
      const el = document.getElementById("pagination");
      if (!pagination) { el.innerHTML = ""; return; }
      el.innerHTML = `
        <button class="secondary" ${pagination.page <= 1 ? "disabled" : ""} onclick="changePage(${pagination.page - 1})">Prev</button>
        <span>Page ${pagination.page} of ${pagination.totalPages} (${pagination.total} contacts)</span>
        <button class="secondary" ${pagination.page >= pagination.totalPages ? "disabled" : ""} onclick="changePage(${pagination.page + 1})">Next</button>
      `;
    }

    function changePage(page) {
      state.page = page;
      loadContacts();
    }

    function editContact(id) {
      window.location.href = `change_contact.html?id=${id}`;
    }

    async function deleteContact(id) {
      if (!confirm("Delete this contact? This cannot be undone.")) return;
      try {
        const res = await fetch(`${API_BASE}/contacts/${id}`, { method: "DELETE" });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `Server responded with status ${res.status}`);
        }
        loadContacts();
      } catch (err) {
        alert("Failed to delete contact: " + err.message);
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        state.search = e.target.value;
        state.page = 1;
        loadContacts();
      }, 300);
    });
    document.getElementById("sortBy").addEventListener("change", (e) => {
      state.sortBy = e.target.value; loadContacts();
    });
    document.getElementById("order").addEventListener("change", (e) => {
      state.order = e.target.value; loadContacts();
    });
    document.getElementById("refreshBtn").addEventListener("click", loadContacts);
    document.getElementById("addBtn").addEventListener("click", () => {
      window.location.href = "add_contact.html";
    });

    window.addEventListener("DOMContentLoaded", loadContacts);
  </script>
</body>
</html>
